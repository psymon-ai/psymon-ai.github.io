name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      PUBLIC_GISCUS_REPO: psymon-ai/psymon-ai.github.io
      PUBLIC_GISCUS_REPO_ID: R_kgDORfpZDw
      PUBLIC_GISCUS_CATEGORY: General
      PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDORfpZD84C3yAb
      PUBLIC_GA_MEASUREMENT_ID: G-DFDREEHM9Z
      PUBLIC_GOATCOUNTER_SITE: psymon-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create .env file
        run: |
          echo "PUBLIC_GISCUS_REPO=${PUBLIC_GISCUS_REPO}" >> .env
          echo "PUBLIC_GISCUS_REPO_ID=${PUBLIC_GISCUS_REPO_ID}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY=${PUBLIC_GISCUS_CATEGORY}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY_ID=${PUBLIC_GISCUS_CATEGORY_ID}" >> .env
          echo "PUBLIC_GA_MEASUREMENT_ID=${PUBLIC_GA_MEASUREMENT_ID}" >> .env
          echo "PUBLIC_GOATCOUNTER_SITE=${PUBLIC_GOATCOUNTER_SITE}" >> .env

      - name: Build with Astro
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
