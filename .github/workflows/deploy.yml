name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # Daily KST 00:00 (UTC 15:00)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ASTRO_TELEMETRY_DISABLED: 1
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      PUBLIC_GISCUS_REPO: psymon-ai/psymon-ai.github.io
      PUBLIC_GISCUS_REPO_ID: R_kgDOSFydGw
      PUBLIC_GISCUS_CATEGORY: General
      PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDOSFydG84C7cVs
      PUBLIC_GA_MEASUREMENT_ID: G-DFDREEHM9Z
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        run: |
          echo "PUBLIC_GISCUS_REPO=${PUBLIC_GISCUS_REPO}" >> .env
          echo "PUBLIC_GISCUS_REPO_ID=${PUBLIC_GISCUS_REPO_ID}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY=${PUBLIC_GISCUS_CATEGORY}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY_ID=${PUBLIC_GISCUS_CATEGORY_ID}" >> .env
          echo "PUBLIC_GA_MEASUREMENT_ID=${PUBLIC_GA_MEASUREMENT_ID}" >> .env
          echo "PUBLIC_GOOGLE_SITE_VERIFICATION=${PUBLIC_GOOGLE_SITE_VERIFICATION}" >> .env

      - name: Build with Astro
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
