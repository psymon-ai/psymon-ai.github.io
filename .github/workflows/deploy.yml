name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # 매일 KST 00:00 (UTC 15:00) 자동 재빌드
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLIC_GISCUS_REPO: psymon-ai/psymon-ai.github.io
      PUBLIC_GISCUS_REPO_ID: R_kgDOSFydGw
      PUBLIC_GISCUS_CATEGORY: General
      PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDOSFydG84C7cVs
      PUBLIC_GA_MEASUREMENT_ID: G-DFDREEHM9Z
      PUBLIC_UMAMI_HOST: https://cloud.umami.is
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create .env file
        run: |
          echo "PUBLIC_GISCUS_REPO=${PUBLIC_GISCUS_REPO}" >> .env
          echo "PUBLIC_GISCUS_REPO_ID=${PUBLIC_GISCUS_REPO_ID}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY=${PUBLIC_GISCUS_CATEGORY}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY_ID=${PUBLIC_GISCUS_CATEGORY_ID}" >> .env
          echo "PUBLIC_GA_MEASUREMENT_ID=${PUBLIC_GA_MEASUREMENT_ID}" >> .env
          echo "PUBLIC_UMAMI_HOST=${PUBLIC_UMAMI_HOST}" >> .env
          echo "PUBLIC_UMAMI_WEBSITE_ID=${PUBLIC_UMAMI_WEBSITE_ID}" >> .env
          echo "UMAMI_API_KEY=${UMAMI_API_KEY}" >> .env

      - name: Build with Astro
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
