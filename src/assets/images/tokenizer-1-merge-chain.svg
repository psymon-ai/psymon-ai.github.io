<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Pruning breaks BPE merge chains</title>
  <desc id="desc">A clean directed graph showing that removing an intermediate BPE merge makes descendant tokens unreachable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title {
        fill: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 28px;
        font-weight: 700;
      }
      .subtitle {
        fill: #64748b;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        font-weight: 500;
      }
      .node-label {
        fill: #111827;
        font-family: Hahmlet, "Apple SD Gothic Neo", "Malgun Gothic", serif;
        font-size: 20px;
        font-weight: 700;
      }
      .note {
        fill: #475569;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 550;
      }
      .edge {
        fill: none;
        stroke: #334155;
        stroke-width: 2.4;
        marker-end: url(#arrow);
      }
      .edge-broken {
        fill: none;
        stroke: #e11d48;
        stroke-width: 2.4;
        stroke-dasharray: 7 7;
        marker-end: url(#arrow);
      }
      .base {
        fill: #f8fafc;
        stroke: #334155;
        stroke-width: 1.8;
      }
      .merge {
        fill: #eff6ff;
        stroke: #2563eb;
        stroke-width: 1.9;
      }
      .pruned {
        fill: #fff1f2;
        stroke: #e11d48;
        stroke-width: 2;
        stroke-dasharray: 7 6;
      }
      .unreachable {
        fill: #f8fafc;
        stroke: #e11d48;
        stroke-width: 2;
        stroke-dasharray: 7 6;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1038" height="518" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="520" y="54" text-anchor="middle" class="title">Pruning Breaks BPE Merge Chains</text>
  <text x="520" y="84" text-anchor="middle" class="subtitle">A descendant token can be used only when every intermediate merge is still reachable.</text>

  <g>
    <rect x="64" y="117" width="112" height="50" rx="10" class="base"/>
    <rect x="64" y="197" width="112" height="50" rx="10" class="base"/>
    <rect x="64" y="295" width="112" height="50" rx="10" class="base"/>
    <rect x="64" y="375" width="112" height="50" rx="10" class="base"/>
    <text x="120" y="149" text-anchor="middle" class="node-label">대</text>
    <text x="120" y="229" text-anchor="middle" class="node-label">한</text>
    <text x="120" y="327" text-anchor="middle" class="node-label">민</text>
    <text x="120" y="407" text-anchor="middle" class="node-label">국</text>
  </g>

  <g>
    <rect x="284" y="156" width="150" height="54" rx="10" class="pruned"/>
    <rect x="284" y="304" width="150" height="54" rx="10" class="merge"/>
    <text x="359" y="189" text-anchor="middle" class="node-label">대한</text>
    <text x="359" y="337" text-anchor="middle" class="node-label">민국</text>
    <text x="359" y="140" text-anchor="middle" class="note" fill="#be123c">pruned</text>
  </g>

  <g>
    <rect x="528" y="226" width="202" height="60" rx="11" class="unreachable"/>
    <text x="629" y="263" text-anchor="middle" class="node-label">대한민국</text>
  </g>

  <g>
    <rect x="806" y="124" width="116" height="54" rx="10" class="base"/>
    <rect x="778" y="314" width="210" height="62" rx="12" class="unreachable"/>
    <text x="864" y="158" text-anchor="middle" class="node-label">에서</text>
    <text x="883" y="352" text-anchor="middle" class="node-label">대한민국에서</text>
  </g>

  <path d="M 176 142 C 220 142 232 183 278 183" class="edge"/>
  <path d="M 176 222 C 220 222 232 183 278 183" class="edge"/>
  <path d="M 176 320 C 220 320 232 331 278 331" class="edge"/>
  <path d="M 176 400 C 220 400 232 331 278 331" class="edge"/>

  <path d="M 434 183 C 482 183 488 246 522 246" class="edge-broken"/>
  <path d="M 434 331 C 482 331 488 266 522 266" class="edge"/>
  <path d="M 730 256 C 760 256 754 338 772 338" class="edge-broken"/>
  <path d="M 864 178 C 864 240 883 260 883 308" class="edge"/>

  <text x="629" y="309" text-anchor="middle" class="note" fill="#be123c">unreachable</text>
  <text x="883" y="399" text-anchor="middle" class="note" fill="#be123c">unreachable</text>
  <text x="520" y="462" text-anchor="middle" class="subtitle">Removing an intermediate merge does not remove one token; it cuts a path in the merge graph.</text>
</svg>
